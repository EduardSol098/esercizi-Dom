<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Person</title>
</head>
<body>

    <div id="container">
        <form>
            <div>
                <label>First Name:</label>
                <input type="text" id="firstName" value="Mario">
            </div>

            <div>
                <label>Last Name:</label>
                <input type="text" id="lastName" value="Rossi">
            </div>

            <div>
                <label>Age:</label>
                <input type="number" id="age" value="25">
            </div>
        </form>
    </div>

    <script>
        // recupero valori input
        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const age = document.getElementById("age").value;

        // creo oggetto person
        const person = {
            firstName: firstName,
            lastName: lastName,
            age: age
        };

        console.log(person);

        // recupero form
        const form = document.querySelector("form");

        // aggiungo attributo data-person in formato JSON
        form.setAttribute("data-person", JSON.stringify(person));

        console.log(form);
    </script>

</body>
</html>
