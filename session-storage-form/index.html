<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Storage Form</title>

    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .form{
            display: flex;
            flex-direction: column;
            max-width: 300px;
            gap: 16px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <h1>Il form di <span class="title-name"></span></h1>

    <div class="form">

        <label for="email">Email</label>
        <input type="email" name="email" class="email" placeholder="email">

        <label for="firstname">Name</label>
        <input type="text" name="firstname" class="firstname" placeholder="firstname">

        <label for="lastname">Surname</label>
        <input type="text" name="lastname" class="lastname" placeholder="lastname">

    </div>

    <button class="btn">Salva</button>

    <p class="printedform"></p>

    <script>
        // recupero elementi
        const emailInput = document.querySelector(".email");
        const firstnameInput = document.querySelector(".firstname");
        const lastnameInput = document.querySelector(".lastname");

        const button = document.querySelector(".btn");
        const titleName = document.querySelector(".title-name");

  
        const savedUser = sessionStorage.getItem("user");

        if (savedUser) {
            const user = JSON.parse(savedUser);

            titleName.innerText = user.firstname;

            emailInput.value = user.email;
            firstnameInput.value = user.firstname;
            lastnameInput.value = user.lastname;
        }

  
        button.addEventListener("click", function () {

            const user = {
                email: emailInput.value,
                firstname: firstnameInput.value,
                lastname: lastnameInput.value
            };

 
            sessionStorage.setItem("user", JSON.stringify(user));


            titleName.innerText = user.firstname;
        });
    </script>

</body>
</html>
